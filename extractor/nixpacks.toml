# Railway/Nixpacks build for the extractor.
# Installs ffmpeg (apt) and the self-contained yt-dlp_linux binary (no python
# runtime needed). Set Railway service "Root Directory" to `extractor`.
#
# Also vendors bgutil-ytdlp-pot-provider (server + yt-dlp plugin) so yt-dlp
# can mint PO tokens for cookie-authenticated requests — without this,
# logged-in extraction returns "Requested format is not available" since
# YouTube gates real formats behind a PO token for the web client. The
# plugin is dropped into yt-dlp's binary-relative plugin dir per the yt-dlp
# plugin spec (<root-dir>/yt-dlp-plugins/<package>/yt_dlp_plugins/); the
# server is a separate Node process server.js spawns on startup, listening
# on 127.0.0.1:4416 (the plugin's default).
[phases.setup]
aptPkgs = [
  "ffmpeg", "curl", "fonts-dejavu-core", "unzip", "git",
  # node-canvas (bgutil server dep) build/runtime requirements
  "build-essential", "pkg-config", "python3",
  "libcairo2-dev", "libpango1.0-dev", "libjpeg-dev", "libgif-dev", "librsvg2-dev",
]

[phases.install]
cmds = [
  "curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o /app/yt-dlp",
  "chmod +x /app/yt-dlp",
  "mkdir -p /app/yt-dlp-plugins",
  "curl -L https://github.com/Brainicism/bgutil-ytdlp-pot-provider/releases/download/1.3.1/bgutil-ytdlp-pot-provider.zip -o /tmp/bgutil-plugin.zip",
  "unzip -o /tmp/bgutil-plugin.zip -d /app/yt-dlp-plugins/bgutil-ytdlp-pot-provider",
  "git clone --quiet --single-branch --branch 1.3.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /app/bgutil-server",
  "cd /app/bgutil-server/server && npm ci && npx tsc",
]

[start]
cmd = "node server.js"
